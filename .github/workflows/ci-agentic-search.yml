name: ci-agentic-search
# P6/R19 §7 — metadata-only search, router-gated browse, budgets, shadow, idempotency, tenant/state isolation.
on:
  push:
    branches: [codex/utility-router-v0.3]
    paths: ['src/enterprise_memory/agentic/**', 'tests/unit/test_agentic_search.py',
            '.github/workflows/ci-agentic-search.yml', 'reports/CI_TRIGGER_MARKER.txt']
  pull_request:
    paths: ['src/enterprise_memory/agentic/**', 'tests/unit/test_agentic_search.py']
  workflow_dispatch: {}
jobs:
  agentic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - name: Install (editable)
        run: pip install -q -e ".[dev]" pytest pyyaml || pip install -q -e . pytest pyyaml
      - name: Agentic search/browse tests
        run: python -m pytest -q tests/unit/test_agentic_search.py
