name: ci-company-demo
# P6/R19 §13/§23 — the offline company demo must produce DEMO_PASS: true from a clean checkout.
on:
  push:
    branches: [codex/utility-router-v0.3]
    paths: ['scripts/demo_company_handoff.py', 'src/enterprise_memory/**',
            'tests/integration/test_company_demo.py', '.github/workflows/ci-company-demo.yml', 'reports/CI_TRIGGER_MARKER.txt']
  pull_request:
    paths: ['scripts/demo_company_handoff.py', 'src/enterprise_memory/**', 'tests/integration/test_company_demo.py', '.github/workflows/ci-company-demo.yml']
  workflow_dispatch: {}
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.10', cache: ''}
      - name: Install (editable)
        run: pip install -q -e ".[dev]" pytest pyyaml || pip install -q -e . pytest pyyaml
      - name: Offline company demo -> DEMO_PASS
        run: python scripts/demo_company_handoff.py --offline
      - name: Demo integration test
        run: python -m pytest -q tests/integration/test_company_demo.py
