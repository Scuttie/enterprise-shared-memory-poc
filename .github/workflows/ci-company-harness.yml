name: ci-company-harness
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  company-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Company-harness adapter tests (fake local harness server only; no credentials, no company endpoint)
        run: python -m pytest -q tests/company_harness --timeout=60 --timeout-method=thread
