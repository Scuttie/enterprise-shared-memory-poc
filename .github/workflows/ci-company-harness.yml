name: ci-company-harness
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  company-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.10"
          cache: ""
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Company-harness adapter tests (fake local harness server only; no credentials, no company endpoint)
        run: python -m pytest -q tests/company_harness --timeout=60 --timeout-method=thread
