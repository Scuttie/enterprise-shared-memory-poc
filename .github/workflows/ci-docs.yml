name: ci-docs
# P6/R19 §2 — fail the build when user-facing docs contradict docs/STATUS.yaml (single source of truth).
on:
  push:
    branches: [codex/utility-router-v0.3, codex/production-service-v0.2]
    paths: ['README.md', 'docs/**', 'scripts/render_project_status.py', 'scripts/check_docs_consistency.py',
            'migrations/**', '.github/workflows/**', 'pyproject.toml']
  pull_request:
    paths: ['README.md', 'docs/**', 'scripts/render_project_status.py', 'scripts/check_docs_consistency.py',
            'migrations/**', '.github/workflows/**', 'pyproject.toml']
  workflow_dispatch: {}
jobs:
  docs-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.10', cache: ''}
      - name: Install PyYAML (optional; scripts fall back to stdlib)
        run: pip install -q pyyaml || true
      - name: Docs consistency (README vs STATUS.yaml)
        run: python scripts/check_docs_consistency.py
      - name: README status block is up to date
        run: python scripts/render_project_status.py --check
