name: ci-oidc
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install (dev + oidc)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,oidc]"
      - name: OIDC / scopes / repository-authorization tests (credential-free, local JWKS)
        run: python -m pytest -q tests/oidc --timeout=90 --timeout-method=thread
