name: ci-oidc
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (dev + oidc)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,oidc]"
      - name: OIDC / scopes / repository-authorization tests (credential-free, local JWKS)
        run: python -m pytest -q tests/oidc --timeout=90 --timeout-method=thread
