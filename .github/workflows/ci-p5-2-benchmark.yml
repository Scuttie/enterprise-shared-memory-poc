name: ci-p5-2-benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: P5.2 coding-instrument audit (strata + nonzero-baseline structure)
        run: python -m pytest -q tests/unit/test_p5_2_benchmark.py --timeout=60
