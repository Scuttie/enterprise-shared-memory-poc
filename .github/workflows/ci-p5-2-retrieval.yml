name: ci-p5-2-retrieval
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Competitive retrieval + frozen abstention thresholds (model-free)
        run: python -m pytest -q tests/unit/test_p5_2_retrieval.py --timeout=60
