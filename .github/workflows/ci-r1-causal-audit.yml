name: ci-r1-causal-audit
on:
  workflow_dispatch: {}
  push:
    branches: [codex/production-service-v0.2]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,realbench]"
      - name: R1 claim-correction + evidence-based patch forensics + frozen-result invariants
        run: python -m pytest tests/realbench/test_patch_forensics.py tests/realbench/test_r1_causal_audit.py tests/realbench/test_seal.py -q
      - name: No DeterministicTestEmbedder in paid benchmark runners/workflows
        run: |
          set -e
          # the paid discovery/calibration/main runners must use the pinned production embedder, never the test embedder
          if grep -RIl "DeterministicTestEmbedder" scripts/ | grep -E "bigcode|swe" ; then
            echo "FAIL: production embedder rule violated"; exit 1; fi
          echo "ok: no test embedder in bigcode/swe runners"
