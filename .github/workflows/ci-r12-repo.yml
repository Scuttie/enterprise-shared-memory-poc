name: ci-r12-repo
# R12-D0/E — gpt-5.6-terra SWE-PolyBench repo agent (secret-gated, Docker). taskset=R7pilot(40)|Etargets(60).
on:
  workflow_dispatch:
    inputs:
      taskset: {description: "R7pilot|Etargets", required: false, default: "R7pilot"}
      arm: {description: "M0/M1/M2/M3/M4", required: false, default: "M0"}
      memory_file: {description: "memory json for M1-M4", required: false, default: ""}
      single: {description: "one instance_id (smoke); blank=all", required: false, default: ""}
  push:
    branches: [codex/production-service-v0.2]
    paths: ['.github/workflows/ci-r12-repo.yml']
concurrency:
  group: ci-r12-repo-${{ github.ref }}-${{ github.event.inputs.taskset }}-${{ github.event.inputs.arm }}
  cancel-in-progress: false
jobs:
  setup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.g.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        env:
          SINGLE: "${{ github.event.inputs.single }}"
          TASKSET: "${{ github.event.inputs.taskset }}"
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          ts = os.environ.get('TASKSET','R7pilot')
          if ts == 'Etargets':
              flat = json.load(open('artifacts/swe_polybench_r12_openai/main_partition.json'))['targets']
          else:
              flat = json.load(open('configs/swe_polybench_r7/g1_targets.json'))['flat']
          s = (os.environ.get('SINGLE') or '').strip()
          if s: flat = [s]
          print("list=" + json.dumps(flat))
          PY
  agent:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        instance: ${{ fromJSON(needs.setup.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - name: Clone + install SWE-PolyBench @ pinned
        run: |
          git clone --no-checkout https://github.com/amazon-science/SWE-PolyBench.git polybench
          cd polybench && git checkout 9c836c5d7f3cb991934132b77d29e6941d912a07
          pip install -r requirements.txt && pip install -e .
      - name: Download pinned Verified test.csv
        run: |
          curl -sL "https://huggingface.co/datasets/AmazonScience/SWE-PolyBench_Verified/resolve/b3fca77b637379f0c01ad86d18753a7ac1998b53/test.csv" -o verified.csv
          test "$(sha256sum verified.csv | cut -d' ' -f1)" = "0c8138e73c34fa29a5276b675b146b72d78ce001fcc4560d76302c908b4808a5"
      - name: R12 repo agent (gpt-5.6-terra)
        env:
          R12_INSTANCE_ID: ${{ matrix.instance }}
          R12_CSV: ${{ github.workspace }}/verified.csv
          R12_POLYBENCH: ${{ github.workspace }}/polybench
          R12_ARM: ${{ github.event.inputs.arm }}
          R12_MEMORY_JSON: ${{ github.event.inputs.memory_file }}
          R12_OUT: ${{ github.workspace }}/r12repo_${{ github.event.inputs.arm }}_${{ matrix.instance }}.json
          R12_MODEL: gpt-5.6-terra
          R12_EFFORT: medium
          R12_MAX_TURNS: "40"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/polybench/src
        run: |
          test -n "$OPENAI_API_KEY" || { echo "no key"; exit 1; }
          python scripts/r12_repo_agent.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12repo-${{ github.event.inputs.taskset }}-${{ github.event.inputs.arm }}-${{ matrix.instance }}
          path: |
            r12repo_${{ github.event.inputs.arm }}_${{ matrix.instance }}.json
            r12repo_${{ github.event.inputs.arm }}_${{ matrix.instance }}.json.patch
