name: ci-r12e-memory
on:
  workflow_dispatch: {}
  push:
    branches: [codex/production-service-v0.2]
    paths: ['.github/workflows/ci-r12e-memory.yml']
jobs:
  mem:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install -q pandas numpy "sentence-transformers==3.0.1"
      - name: Download pinned Verified test.csv
        run: |
          curl -sL "https://huggingface.co/datasets/AmazonScience/SWE-PolyBench_Verified/resolve/b3fca77b637379f0c01ad86d18753a7ac1998b53/test.csv" -o verified.csv
      - name: Build M1-M4 memory
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          R12E_CSV: ${{ github.workspace }}/verified.csv
        run: |
          test -n "$OPENAI_API_KEY" || { echo "no key"; exit 1; }
          python scripts/r12e_memory.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12e-memory
          path: artifacts/swe_polybench_r12_openai/memory_*.json
