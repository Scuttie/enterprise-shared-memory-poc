name: ci-r20-freeze
# R20 component-factorial gate.
on:
  push:
    branches: [codex/r20-component-factorial]
    paths: ['artifacts/r20/**','configs/r20/**','scripts/r20_*.py','tests/unit/test_r20_freeze.py','docs/R20_*','.github/workflows/ci-r20-freeze.yml']
  pull_request:
    paths: ['artifacts/r20/**','scripts/r20_*.py','tests/unit/test_r20_freeze.py']
  workflow_dispatch: {}
jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: install
        run: pip install -q -e ".[dev]" pytest pyyaml || pip install -q -e . pytest pyyaml
      - name: freeze + R19 non-overlap
        run: python -m pytest -q tests/unit/test_r20_freeze.py -k 'excludes_r19 or task_manifest_hash or freeze_master or all_r20_locks'
