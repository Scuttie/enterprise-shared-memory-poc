name: ci-r22-scb-grader-smoke
# R22-P0.8 §6 — OFFICIAL SWE-ContextBench grader discrimination smoke (12 frozen P1 targets).
# Grades the official GOLD patch (expect resolved) and a NO-PATCH prediction (expect unresolved) with the
# BENCHMARK-SPECIFIC evaluator: an ephemeral pinned checkout of `swebench_memory.harness.run_evaluation` + the
# official per-instance image `jiayuanz3/swecontextbench:<tag>`. NO model calls, NO secret, paid API = 0.
#
# GATED: dispatch-only AND requires confirm_exec_approved == 'EXEC_APPROVED'. The upstream evaluation code has NO
# explicit license (reports/R22_UPSTREAM_RIGHTS_STATUS.md); executing it — even as an ephemeral checkout — is a
# research-execution decision. Without approval the job runs the gate and stops (it does NOT execute upstream code).
# Sharded by target; both conditions for a target run in the same shard so the image is pulled once.
on:
  workflow_dispatch:
    inputs:
      confirm_exec_approved:
        description: "must be exactly EXEC_APPROVED (acknowledges executing the unlicensed pinned upstream evaluator)"
        required: true
        default: ""
permissions:
  contents: read
jobs:
  scb-smoke:
    runs-on: ubuntu-latest
    environment: research-paid            # reuse the approval-gated environment (no secret is read here)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        instance:
          - apache__lucene-13388
          - astral-sh__ruff-15725
          - astral-sh__ruff-15997
          - astral-sh__ruff-16445
          - astropy__astropy-14500
          - astropy__astropy-15082
          - astropy__astropy-6389
          - astropy__astropy-7167
          - astropy__astropy-8614
          - astropy__astropy-8711
          - caddyserver__caddy-5770
          - caddyserver__caddy-5930
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Execution-approval gate (compliance, not a technical block)
        run: |
          test "${{ inputs.confirm_exec_approved }}" = "EXEC_APPROVED" \
            || { echo "R22_UPSTREAM_EVALUATOR_EXECUTION_REVIEW: approval not given; not executing upstream code."; exit 1; }
      - name: Free disk + docker preflight
        if: ${{ inputs.confirm_exec_approved == 'EXEC_APPROVED' }}
        run: |
          docker info >/dev/null && echo "docker OK"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - run: pip install -q -e .
        if: ${{ inputs.confirm_exec_approved == 'EXEC_APPROVED' }}
      - name: OFFICIAL SCB grader smoke — gold + no-patch (single target shard)
        if: ${{ inputs.confirm_exec_approved == 'EXEC_APPROVED' }}
        env:
          R22_SCB_UPSTREAM_EXEC_APPROVED: "1"
        run: |
          timeout 5400 python scripts/r22_scb_grader_smoke.py \
            --instance-ids "${{ matrix.instance }}" \
            --out "artifacts/r22/scb_grader_smoke_${{ matrix.instance }}.json"
      - name: Cleanup instance image
        if: ${{ always() && inputs.confirm_exec_approved == 'EXEC_APPROVED' }}
        run: |
          tag=$(python -c "print('${{ matrix.instance }}'.replace('__','.').lower())")
          docker rmi "jiayuanz3/swecontextbench:${tag}" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scb-smoke-${{ matrix.instance }}
          path: artifacts/r22/scb_grader_smoke_${{ matrix.instance }}.json
