name: ci-r23-gradeability
# R23-B0 §6 — per-target SWE-bench Verified gradeability (GOLD + NOOP) via the official swebench harness.
# Credential-free (Docker only; NO model, NO secret, paid API = 0). Dispatch-only + EXEC-gated; NOT auto-triggered
# for all 500. Per-target sharded; resumable by missing target only; fail-closed aggregate. Because this workflow
# lives only on the feature branch, a real run uses the committed-sentinel mechanism (as in R22) once approved.
on:
  workflow_dispatch:
    inputs:
      confirm_exec_approved:
        description: "must be exactly EXEC_APPROVED_R23_GRADEABILITY (credential-free docker; unlicensed-upstream note in grader_lock)"
        required: true
        default: ""
      instance_ids:
        description: "comma-separated SWE-bench Verified instance_ids to grade (the fixed paid pool; NOT all 500)"
        required: true
        default: ""
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ inputs.confirm_exec_approved }}" = "EXEC_APPROVED_R23_GRADEABILITY" \
            || { echo "not approved; no execution"; exit 1; }
  grade:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: docker info >/dev/null && df -h /
      - run: pip install -q "swebench==5.0.2" "datasets>=2.19,<3"
      - name: Grade the requested pool (GOLD + NOOP)
        env:
          R23_UPSTREAM_EXEC_APPROVED: "1"
        run: |
          IFS=',' read -ra IDS <<< "${{ inputs.instance_ids }}"
          for iid in "${IDS[@]}"; do
            [ -f "artifacts/r23/grade_${iid}.json" ] && { echo "resume-skip $iid"; continue; }   # resume missing only
            timeout 3600 python scripts/r23_gradeability.py --instance-id "$iid" --out "artifacts/r23/grade_${iid}.json" || echo "RC=$?"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: r23-gradeability, path: artifacts/r23/grade_*.json}
  aggregate:
    needs: grade
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with: {path: _shards}
      - run: python scripts/r23_gradeability_aggregate.py --download-dir _shards || echo "fail-closed aggregate rc=$?"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: r23-gradeability-campaign, path: artifacts/r23/gradeability_*.json}
