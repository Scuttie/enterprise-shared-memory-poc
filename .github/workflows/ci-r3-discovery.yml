name: ci-r3-discovery

# REALBENCH-R3 §12/§14: representation discovery on the DISCOVERY split (12 arms, oracle-forced rendered views
# B0-B9) through the real service path inside the DS-1000 conda env, then §14 lexicographic policy selection.
# Dispatch with `subset` (first-N-per-library, single chunk, no combine) for a smoke; marker [run-r3-discovery]
# (or dispatch with subset blank) runs the 6-chunk matrix + combine.

on:
  workflow_dispatch:
    inputs:
      subset:
        description: "first-N-per-library smoke (single chunk, no combine); blank = full 6-chunk matrix"
        required: false
        default: ""
  push:
    branches: [codex/production-service-v0.2]

concurrency:
  group: ci-r3-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    if: contains(github.event.head_commit.message, '[run-r3-discovery]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      combine: ${{ steps.m.outputs.combine }}
    steps:
      - id: m
        run: |
          if [ -n "${{ github.event.inputs.subset }}" ]; then
            echo 'matrix=["0/1"]' >> "$GITHUB_OUTPUT"; echo "combine=false" >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["0/6","1/6","2/6","3/6","4/6","5/6"]' >> "$GITHUB_OUTPUT"; echo "combine=true" >> "$GITHUB_OUTPUT"
          fi

  discovery:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        chunk: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: bash -el {0}
    services:
      postgres:
        image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: esm}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d esm" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Start Qdrant
        run: docker run -d --name qdrant -p 6333:6333 qdrant/qdrant:v1.12.4@sha256:241edb9d7778327516ef218f8c74e1bd61b5ea42cd4f193cb8d0896199705636
      - name: Clone DS-1000 at pinned commit
        run: |
          git clone --no-checkout https://github.com/xlang-ai/DS-1000.git DS-1000
          cd DS-1000 && git checkout b39aab71da6d23ef8d3cac59a7c5f834516ab334
      - name: Official DS-1000 conda env
        uses: mamba-org/setup-micromamba@v1
        with: {environment-file: DS-1000/environment.yml, cache-environment: true, init-shell: bash}
      - name: Install ESM into the env (pinned constraints)
        run: micromamba run -n ds1000-3.10 python -m pip install --no-input -c configs/actionable_memory_r3/ds1000_pip_constraints.txt -e ".[dev,postgres,qdrant,artifacts,oidc,embed]" pyjwt cryptography datasets tqdm tiktoken
      - name: Env file
        run: |
          test -n "${{ secrets.UPSTAGE_API_KEY }}" || { echo "no UPSTAGE_API_KEY"; exit 1; }
          cat > ds1000.env <<ENV
          DATABASE_URL=postgresql://localhost:5432/esm
          MIGRATION_USER=postgres
          MIGRATION_PASSWORD=postgres
          PGHOST=localhost
          PGPORT=5432
          PGUSER=postgres
          PGPASSWORD=postgres
          PGDATABASE=esm
          QDRANT_URL=http://localhost:6333
          ARTIFACT_DIR=/tmp/esm-artifacts
          ARTIFACT_PER_JOB=1
          INDEX_DIM=384
          EMBEDDER=st
          ENVIRONMENT=ci
          REPO_PROVIDER=ds1000
          EXECUTION_BACKEND=ds1000
          DS1000_REPO=$PWD/DS-1000
          DS1000_DATA=$PWD/DS-1000/data/ds1000.jsonl.gz
          SOLAR_MODEL=solar-pro2-251215
          SOLAR_BASE_URL=https://api.upstage.ai/v1/solar
          SOLAR_MAX_TOKENS=1024
          SOLAR_MAX_ATTEMPTS=10
          SOLAR_TOTAL_DEADLINE=360
          UPSTAGE_API_KEY=${{ secrets.UPSTAGE_API_KEY }}
          OIDC_ISSUER=https://idp.e2e.local/
          OIDC_AUDIENCE=esm-api
          OIDC_JWKS_FILE=$PWD/jwks.json
          E2E_API_URL=http://127.0.0.1:8000
          API_PORT=8000
          RUN_DEADLINE=7200
          R3_RUN_TIMEOUT=7800
          R3_GRADE_SUBPROCESS=1
          CHUNK=${{ matrix.chunk }}
          DISCOVERY_SUBSET=${{ github.event.inputs.subset }}
          HF_HUB_DISABLE_TELEMETRY=1
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
          USE_TF=0
          USE_TORCH=1
          PYTHONUNBUFFERED=1
          PYTHONPATH=$PWD:$PWD/src:$PWD/DS-1000
          ENV
      - name: Migrate + warm embedder
        run: |
          set -a; source ds1000.env; set +a
          micromamba run -n ds1000-3.10 python scripts/postgres_bootstrap.py
          micromamba run -n ds1000-3.10 alembic upgrade head
          mkdir -p /tmp/esm-artifacts
          micromamba run -n ds1000-3.10 python -c "from enterprise_memory.indexing.embeddings import SentenceTransformerEmbedder as E; e=E(); e.embed(['warm']); print('embedder', e.dim)"
      - name: Start API + workers + run discovery chunk
        run: |
          set -a; source ds1000.env; set +a
          micromamba run -n ds1000-3.10 bash -lc '
            python -m enterprise_memory.service.appcli > api.log 2>&1 & APIPID=$!
            python scripts/_wait_http.py http://127.0.0.1:8000/health/live 120
            WPIDS=""
            for i in 1 2; do WORKER_ID=r3d-worker-$i python -m enterprise_memory.service.solve_worker > worker-$i.log 2>&1 & WPIDS="$WPIDS $!"; done
            sleep 2
            timeout --signal=KILL "${R3_RUN_TIMEOUT:-7800}" python scripts/r3_discovery_run.py 2>&1 | tee r3run.log
            RC=${PIPESTATUS[0]}; echo "runner exit code: $RC"
            kill -9 $APIPID $WPIDS 2>/dev/null || true
            exit $RC
          '
      - name: Logs (always)
        if: always()
        run: for f in r3run.log api.log worker-1.log worker-2.log; do echo "==== $f ===="; tail -n 80 "$f" 2>/dev/null || true; done
      - name: Upload raw chunk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-discovery-raw-${{ strategy.job-index }}
          path: artifacts/actionable_memory_r3/results/discovery_raw.*.json

  combine:
    needs: [setup, discovery]
    if: needs.setup.outputs.combine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: python -m pip install --quiet tiktoken sqlalchemy
      - uses: actions/download-artifact@v4
        with: {pattern: r3-discovery-raw-*, path: dl, merge-multiple: true}
      - name: Combine + select policy
        env:
          DS1000_DATA: ${{ github.workspace }}/ds1000.jsonl.gz
        run: |
          mkdir -p artifacts/actionable_memory_r3/results
          cp dl/discovery_raw.*.json artifacts/actionable_memory_r3/results/ 2>/dev/null || true
          curl -sSL -o ds1000.jsonl.gz "https://raw.githubusercontent.com/xlang-ai/DS-1000/b39aab71da6d23ef8d3cac59a7c5f834516ab334/data/ds1000.jsonl.gz"
          python scripts/r3_discovery_combine.py
      - name: Upload discovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-discovery-results
          path: |
            artifacts/actionable_memory_r3/discovery_results.json
            artifacts/actionable_memory_r3/selected_policy.json
