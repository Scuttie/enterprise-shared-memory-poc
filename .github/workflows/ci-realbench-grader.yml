name: ci-realbench-grader
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,realbench]"
      - name: REALBENCH-R1 grader (official EvalPlus MBPP+, Linux)
        run: python -m pytest -q tests/realbench/test_grader.py --timeout=600
