name: ci-realbench-seal
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,realbench]"
      - name: REALBENCH-R1 freeze seal
        run: python -m pytest -q tests/realbench/test_seal.py --timeout=600
