name: ci-solar
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  solar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Solar provider tests (fake OpenAI-compatible server; no real key, no network)
        run: python -m pytest -q tests/solar --timeout=120 --timeout-method=thread
