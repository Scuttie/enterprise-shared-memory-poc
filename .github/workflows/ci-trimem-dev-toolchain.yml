name: TriMem V1 credential-free DEV toolchain rehearsal
# D1.6 exact-head pre-execution credential-free gate.

on:
  push:
    branches:
      - codex/trimem-coder-v1
    paths:
      - .github/workflows/ci-trimem-dev-toolchain.yml
      - .github/workflows/trimem-benchmark.yml
      - configs/trimem_v1/gh_cli_lock.json
      - configs/trimem_v1/solve_output_budget_contract.json
      - artifacts/trimem_v1/development_solve_execution_contract_amendment.json
      - artifacts/trimem_v1/development_credential_control_plane_amendment.json
      - artifacts/trimem_v1/solve_output_budget_contract_lock.json
      - scripts/trimem_development_trigger_preflight.py
      - scripts/trimem_development_trigger_d15.py
      - scripts/trimem_audit_encrypted_evidence.py
      - scripts/trimem_benchmark_matrix.py
      - scripts/trimem_benchmark_run.py
      - scripts/trimem_exec_approval.py
      - scripts/trimem_install_pinned_gh.py
      - scripts/trimem_verify_gh_lock.py
      - scripts/trimem_verify_ready.py
      - scripts/trimem_openai_model_access_check.py
      - scripts/trimem_validate_openai_credential.py
      - scripts/trimem_verify_openai_key_binding.py
      - src/enterprise_memory/providers/base.py
      - src/enterprise_memory/providers/openai_credential.py
      - src/enterprise_memory/providers/openai_responses.py
      - src/enterprise_memory/trimem/agent_runtime.py
      - src/enterprise_memory/trimem/gateway.py
      - src/enterprise_memory/trimem/git_workspace.py
      - src/enterprise_memory/trimem/runtime_lock.py
      - src/enterprise_memory/trimem/solve_forensics.py
      - src/enterprise_memory/trimem/workspace.py
      - tests/unit/test_trimem_dev_toolchain_workflows.py
      - tests/unit/test_trimem_pinned_gh.py
      - tests/unit/test_trimem_development_trigger.py
      - tests/unit/test_trimem_d14_solve_contract.py
      - tests/unit/test_trimem_d15_credential_control.py
      - tests/unit/test_trimem_evidence_custody.py
      - tests/unit/test_trimem_smoke_attestation_only.py

permissions:
  actions: read
  contents: read

jobs:
  pinned-gh-and-smoke-attestation-only:
    runs-on: [self-hosted, linux, x64, ubuntu-24.04, trimem-benchmark]
    timeout-minutes: 45
    steps:
      - name: Checkout exact correction commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.10
          cache: ""
      - name: Install hash-locked environment
        run: |
          python -m pip install --require-hashes -r configs/trimem_v1/benchmark_environment.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Install exact pinned GitHub CLI
        run: |
          set -euo pipefail
          expected_bin="$RUNNER_TEMP/trimem-gh/bin"
          observed_bin="$(
            python scripts/trimem_install_pinned_gh.py \
              --lock configs/trimem_v1/gh_cli_lock.json \
              --prefix "$RUNNER_TEMP/trimem-gh"
          )"
          test "$observed_bin" = "$expected_bin"
          printf '%s\n' "$observed_bin" >> "$GITHUB_PATH"
      - name: Verify exact GitHub CLI
        run: |
          set -euo pipefail
          resolved_gh="$(command -v gh)"
          test "$resolved_gh" = "$RUNNER_TEMP/trimem-gh/bin/gh"
          gh --version
          python scripts/trimem_verify_gh_lock.py \
            --lock configs/trimem_v1/gh_cli_lock.json \
            --prefix "$RUNNER_TEMP/trimem-gh"
      - name: Verify official smoke attestation only with zero scientific work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/trimem-smoke-attestation-only.json"
          python scripts/trimem_verify_ready.py \
            --level smoke-attestation-only \
            --require-git-tracked \
            | tee "$report"
          python - "$report" <<'PY'
          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_zero_fields = {
              "api_calls",
              "database_operations",
              "decomposition_calls",
              "docker_image_pulls",
              "extraction_calls",
              "grader_calls",
              "grader_containers",
              "input_tokens",
              "model_calls",
              "model_gateway_calls",
              "official_grader_runs",
              "output_tokens",
              "paid_model_calls",
              "reasoning_tokens",
              "solve_calls",
              "support_service_containers",
              "support_service_image_pulls",
              "target_image_pulls",
              "task_arm_runs",
              "total_usd",
          }
          attestation = report.get("attestation_verification")
          actuals = report.get("attestation_only_execution")
          if report.get("status") != "PASS":
              raise SystemExit("smoke-attestation-only did not pass")
          if not isinstance(attestation, dict) or attestation.get("status") != "PASS":
              raise SystemExit("cryptographic smoke attestation was not verified")
          if attestation.get("live_run_attempt_query_count") != 1:
              raise SystemExit("exactly one live historical run-attempt query is required")
          if not isinstance(actuals, dict) or set(actuals) != expected_zero_fields:
              raise SystemExit("attestation-only operation counter field set differs")
          nonzero = {
              name: value
              for name, value in actuals.items()
              if type(value) not in {int, float} or value != 0
          }
          if nonzero:
              raise SystemExit(f"attestation-only performed scientific work: {nonzero!r}")
          PY
