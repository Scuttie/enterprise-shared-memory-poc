name: TriMem Multi-SWE prebuilt contract

on:
  pull_request:
  push:
    branches:
      - codex/trimem-coder-v1

concurrency:
  group: trimem-multi-swe-contract-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pinned-contract-preexec:
    name: Pinned contract and no-build rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact TriMem source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.10
          cache: ""
      - name: Install hash-locked credential-free environment
        run: |
          python -m pip install --require-hashes -r configs/trimem_v1/benchmark_environment.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Materialize exact pinned upstream commit
        run: |
          git init "$RUNNER_TEMP/multi-swe-bench"
          git -C "$RUNNER_TEMP/multi-swe-bench" remote add origin https://github.com/multi-swe-bench/multi-swe-bench
          git -C "$RUNNER_TEMP/multi-swe-bench" fetch --depth=1 origin 24f493f8a103e72312ded4f6b9c89f081d69cb09
          git -C "$RUNNER_TEMP/multi-swe-bench" checkout --detach 24f493f8a103e72312ded4f6b9c89f081d69cb09
      - name: Verify required Git blobs and pinned control flow
        run: >-
          python scripts/trimem_multi_swe_contract.py
          --repository "$RUNNER_TEMP/multi-swe-bench"
          --output "$RUNNER_TEMP/trimem-multi-swe-live-contract.json"
      - name: Rehearse exact frozen Vue row through production builder
        run: >-
          python scripts/trimem_multi_swe_preexec.py
          --cache-dir "$RUNNER_TEMP/trimem-pinned-dataset-cache"
          --harness-root "$RUNNER_TEMP/multi-swe-bench"
          --output "$RUNNER_TEMP/trimem-multi-swe-frozen-row-preexec.json"
      - name: Exercise production config builder and Docker tripwires without Docker
        run: >-
          python scripts/trimem_pytest_no_skip.py
          tests/unit/test_trimem_multi_*.py
      - name: Upload allowlisted live source-contract proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-multi-swe-live-contract
          path: ${{ runner.temp }}/trimem-multi-swe-live-contract.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload allowlisted frozen-row rehearsal proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-multi-swe-frozen-row-preexec
          path: ${{ runner.temp }}/trimem-multi-swe-frozen-row-preexec.json
          if-no-files-found: error
          retention-days: 30

  exact-vue-image-contract-probe:
    name: One-time marker-bound exact Vue image contract probe
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/trimem-coder-v1'
    needs: pinned-contract-preexec
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact probe source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.10
          cache: ""
      - name: Classify checked-out Git push and validate an exact marker request
        id: probe_gate
        run: >-
          python scripts/trimem_multi_swe_probe_request.py
          --repository .
          --event-path "$GITHUB_EVENT_PATH"
          --gate-report "$RUNNER_TEMP/multi_swe_vue_image_probe_gate.json"
          --github-output "$GITHUB_OUTPUT"
      - name: Preserve sanitized probe-gate evidence
        if: ${{ always() && steps.probe_gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-multi-swe-vue-image-probe-gate
          path: ${{ runner.temp }}/multi_swe_vue_image_probe_gate.json
          if-no-files-found: error
          retention-days: 30
      - name: Pull, observe, inspect metadata, and remove the exact Vue image
        id: image_probe
        if: >-
          needs.pinned-contract-preexec.result == 'success' &&
          steps.probe_gate.outputs.decision == 'EXECUTE'
        run: >-
          python scripts/trimem_multi_swe_image_probe.py
          --output "$RUNNER_TEMP/multi_swe_vue_image_probe.json"
      - name: Preserve only the sanitized probe result on pass or failure
        id: probe_artifact
        if: ${{ always() && steps.image_probe.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-multi-swe-vue-image-probe
          path: ${{ runner.temp }}/multi_swe_vue_image_probe.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed if an exact request did not reach the image probe
        if: ${{ always() && steps.probe_gate.outputs.decision == 'EXECUTE' }}
        env:
          IMAGE_PROBE_OUTCOME: ${{ steps.image_probe.outcome }}
          PREEXEC_OUTCOME: ${{ needs.pinned-contract-preexec.result }}
        run: |
          test "$PREEXEC_OUTCOME" = "success"
          test "$IMAGE_PROBE_OUTCOME" = "success"
