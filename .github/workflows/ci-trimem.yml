name: TriMem V1 static CI

on:
  pull_request:
  push:
    branches:
      - codex/trimem-coder-v1

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.10
          cache: ""
      - name: Rehearse dependency-free DEV preflight boundary
        run: |
          python -I -S scripts/trimem_freeze.py --check --require-git-tracked
          python -I -S scripts/trimem_development_trigger_preflight.py --help
      - name: Install hash-locked environment
        run: |
          python -m pip install --require-hashes -r configs/trimem_v1/benchmark_environment.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Reproduce target selection from immutable datasets
        run: python scripts/trimem_select_targets.py --verify
      - name: Verify four preregistered executable M2 bundles
        run: python scripts/trimem_m2_candidates.py --verify
      - name: Run credential-free unit and Mini provider boundaries without skips
        run: |
          python scripts/trimem_pytest_no_skip.py tests/unit/test_trimem_*.py tests/trimem/e2e/test_full_replay.py tests/openai/test_openai_provider.py tests/openai/test_openai_response_outcomes.py
          python scripts/trimem_provider_output_contract.py
      - name: Verify product handoff manifest remains separated and current
        run: python scripts/make_handoff_manifest.py --check
      - name: Scan tracked source for forbidden credentials and host paths
        run: python scripts/release_check.py --secrets
      - name: Verify committed freeze and D1.3 fresh-run approval boundaries
        run: |
          python scripts/trimem_freeze.py --check --require-git-tracked
          python scripts/trimem_verify_ready.py --level static --require-git-tracked
          python - <<'PY'
          import json
          import subprocess
          import sys

          cases = (
              ("benchmark-approval", 0, []),
              (
                  "grader-smoke-exec",
                  1,
                  ["external immutable approval file is required"],
              ),
              (
                  "benchmark-exec",
                  1,
                  ["external immutable approval file is required"],
              ),
          )
          for level, expected_returncode, expected_blockers in cases:
              completed = subprocess.run(
                  [
                      sys.executable,
                      "scripts/trimem_verify_ready.py",
                      "--level",
                      level,
                      "--require-git-tracked",
                  ],
                  capture_output=True,
                  check=False,
                  text=True,
              )
              sys.stdout.write(completed.stdout)
              sys.stderr.write(completed.stderr)
              if completed.returncode != expected_returncode:
                  raise SystemExit(
                      f"{level}: expected exit {expected_returncode}, got "
                      f"{completed.returncode}"
                  )
              try:
                  report = json.loads(completed.stdout)
              except (json.JSONDecodeError, TypeError) as exc:
                  raise SystemExit(f"{level}: invalid readiness JSON: {exc}") from exc
              observed = {
                  "blockers": report.get("blockers"),
                  "endpoint": report.get("endpoint"),
                  "level": report.get("level"),
                  "status": report.get("status"),
              }
              expected = {
                  "blockers": expected_blockers,
                  "endpoint": "TRIMEM_V1_DEV_INCOMPLETE",
                  "level": level,
                  "status": "PASS" if not expected_blockers else "FAIL_CLOSED",
              }
              if observed != expected:
                  raise SystemExit(
                      f"{level}: expected exact D1.3 report {expected!r}, "
                      f"got {observed!r}"
                  )
          PY
