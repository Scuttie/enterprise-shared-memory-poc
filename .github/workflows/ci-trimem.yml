name: TriMem V1 static CI

on:
  pull_request:
  push:
    branches:
      - codex/trimem-coder-v1

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.10
          cache: ""
      - name: Rehearse dependency-free D1.22 boundary
        run: |
          python -I -S scripts/trimem_freeze.py --check --require-git-tracked
          python -I -S scripts/trimem_compiled_prefix_alias.py --help
          python -I -S scripts/trimem_development_trigger_d122.py --help
          python -I -S scripts/trimem_d122_reseal.py --help
          python -I -S scripts/trimem_d119_approval_secret.py --help
      - name: Install hash-locked environment
        run: |
          python -m pip install --require-hashes -r configs/trimem_v1/benchmark_environment.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Reproduce target selection from immutable datasets
        run: python scripts/trimem_select_targets.py --verify
      - name: Verify four preregistered executable M2 bundles
        run: python scripts/trimem_m2_candidates.py --verify
      - name: Run credential-free unit and Mini provider boundaries without skips
        run: |
          python scripts/trimem_pytest_no_skip.py tests/unit/test_trimem_*.py tests/trimem/e2e/test_full_replay.py tests/openai/test_openai_provider.py tests/openai/test_openai_response_outcomes.py
          python scripts/trimem_provider_output_contract.py
      - name: Verify product handoff manifest remains separated and current
        run: python scripts/make_handoff_manifest.py --check
      - name: Scan tracked source for forbidden credentials and host paths
        run: python scripts/release_check.py --secrets
      - name: Verify committed freeze and D1.22 no-execution-authority boundary
        run: |
          python scripts/trimem_freeze.py --check --require-git-tracked
          python -I -S scripts/trimem_d113_gate_contract.py \
            --fixture tests/fixtures/trimem_d113/exec_012_preprotected_failure.json
          python -I -S scripts/trimem_d114_gate_contract.py \
            --fixture tests/fixtures/trimem_d114/exec_013_post_setup_failure.json
          python -I -S scripts/trimem_d115_gate_contract.py \
            --fixture tests/fixtures/trimem_d115/exec_014_loader_failure.json
          python -I -S scripts/trimem_d122_reseal.py --check
          python -I -S scripts/trimem_development_trigger_d122.py \
            --repository "$GITHUB_WORKSPACE" \
            --validate-current
          python scripts/trimem_verify_ready.py --level static --require-git-tracked
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          cases = (
              (
                  "benchmark-approval",
                  1,
                  [
                      "explicit request-creation authority for `_022` is required"
                  ],
              ),
              (
                  "grader-smoke-exec",
                  1,
                  ["external immutable approval file is required"],
              ),
              (
                  "benchmark-exec",
                  1,
                  ["external immutable approval file is required"],
              ),
          )
          for level, expected_returncode, expected_blockers in cases:
              completed = subprocess.run(
                  [
                      sys.executable,
                      "scripts/trimem_verify_ready.py",
                      "--level",
                      level,
                      "--require-git-tracked",
                  ],
                  capture_output=True,
                  check=False,
                  text=True,
              )
              sys.stdout.write(completed.stdout)
              sys.stderr.write(completed.stderr)
              if completed.returncode != expected_returncode:
                  raise SystemExit(
                      f"{level}: expected exit {expected_returncode}, got "
                      f"{completed.returncode}"
                  )
              try:
                  report = json.loads(completed.stdout)
              except (json.JSONDecodeError, TypeError) as exc:
                  raise SystemExit(f"{level}: invalid readiness JSON: {exc}") from exc
              observed = {
                  "blockers": report.get("blockers"),
                  "endpoint": report.get("endpoint"),
                  "level": report.get("level"),
                  "status": report.get("status"),
              }
              expected = {
                  "blockers": expected_blockers,
                  "endpoint": (
                      "QDRANT_RLIMIT_NOFILE_PORTABILITY_FAILURE"
                  ),
                  "level": level,
                  "status": "PASS" if not expected_blockers else "FAIL_CLOSED",
              }
              if observed != expected:
                  raise SystemExit(
                      f"{level}: expected exact D1.22 readiness report {expected!r}, "
                      f"got {observed!r}"
                  )
              if "official_grader_viability" in report:
                  raise SystemExit(f"{level}: broad grader viability leaked")
              expected_split = {
                  "OFFICIAL_GRADER_SEMANTICS_AND_DISCRIMINATION": (
                      "ESTABLISHED_BY_P0_1_5"
                  ),
                  "OFFICIAL_GRADER_IMAGE_INTEGRITY": "ESTABLISHED",
                  "OFFICIAL_GRADER_DEV_RUNNER_PYTHON_LAUNCH": (
                      "PASS_ON_EXEC_021_24_CELLS"
                  ),
                  "OFFICIAL_GRADER_DEV_RUNNER_CONTAINER_START": (
                      "PASS_ON_EXEC_021_24_CELLS"
                  ),
                  "PERFORMANCE": "NOT_MEASURED",
              }
              observed_split = {
                  key: report.get(key) for key in expected_split
              }
              if observed_split != expected_split:
                  raise SystemExit(
                      f"{level}: D1.22 split status differs: {observed_split!r}"
                  )
          PY
