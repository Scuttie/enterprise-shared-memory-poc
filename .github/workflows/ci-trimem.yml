name: TriMem V1 static CI

on:
  pull_request:
  push:
    branches:
      - codex/trimem-coder-v1

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.10
          cache: ""
      - name: Rehearse dependency-free DEV preflight boundary
        run: |
          python -I -S scripts/trimem_freeze.py --check --require-git-tracked
          python -I -S scripts/trimem_development_trigger_preflight.py --help
      - name: Install hash-locked environment
        run: |
          python -m pip install --require-hashes -r configs/trimem_v1/benchmark_environment.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Reproduce target selection from immutable datasets
        run: python scripts/trimem_select_targets.py --verify
      - name: Verify four preregistered executable M2 bundles
        run: python scripts/trimem_m2_candidates.py --verify
      - name: Run credential-free unit and Mini provider boundaries without skips
        run: |
          python scripts/trimem_pytest_no_skip.py tests/unit/test_trimem_*.py tests/trimem/e2e/test_full_replay.py tests/openai/test_openai_provider.py
      - name: Verify committed freeze and P0.1.5 recovery-ready closure
        run: |
          python scripts/trimem_freeze.py --check --require-git-tracked
          python scripts/trimem_verify_ready.py --level static --require-git-tracked
          python scripts/trimem_verify_ready.py --level benchmark-approval --require-git-tracked
          if python scripts/trimem_verify_ready.py --level grader-smoke-exec --require-git-tracked; then
            echo "grader-smoke execution unexpectedly passed without the exact external _005 approval" >&2
            exit 1
          fi
          if python scripts/trimem_verify_ready.py --level benchmark-exec --require-git-tracked; then
            echo "DEV/HELDOUT execution unexpectedly passed without a post-smoke approval" >&2
            exit 1
          fi
