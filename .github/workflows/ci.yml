name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (base + dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Package import smoke
        run: python -c "import enterprise_memory; from enterprise_memory.serving import governed_view, api"
      - name: Unit + security + API + contracts tests (no Solar, no Mem0, no network)
        run: python -m pytest -q tests/unit tests/security tests/integration/test_api.py tests/service tests/contracts
      - name: Offline Alice/Bob demo
        run: python scripts/demo_alice_bob.py --offline
      - name: OpenAPI snapshot check
        run: python scripts/release_check.py --openapi
      - name: Release manifest integrity
        run: python scripts/release_check.py --manifest
      - name: Secret / path scan
        run: python scripts/release_check.py --secrets
