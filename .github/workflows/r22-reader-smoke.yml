name: r22-reader-smoke
# §7C — P1 real-reader integration smoke, 12 tasks x O0-O6 = 84 runs (paid). Dispatch-only; research-paid;
# requires the reader-lock artifact hash + RUN_APPROVED + budget. No auto-run.
on:
  workflow_dispatch:
    inputs:
      confirm_run_approved: {description: "must be exactly RUN_APPROVED", required: true, default: ""}
      reader_model: {description: "selected reader model id", required: true}
      reader_secret_name: {description: "secret NAME only", required: true}
      smoke_budget_usd: {description: "R22_SMOKE_BUDGET_USD (>= P1 hard cap)", required: true}
      reader_lock_sha256: {description: "hash of the committed reader lock", required: true}
permissions:
  contents: read
jobs:
  p1-smoke:
    runs-on: ubuntu-latest
    environment: research-paid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q -e .
      - name: Paid gate (P1 hard cap)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/r22_paid_gate.py --stage p1 --model "${{ inputs.reader_model }}" \
            --budget "${{ inputs.smoke_budget_usd }}" --run-approved "${{ inputs.confirm_run_approved }}" \
            --secret-name "${{ inputs.reader_secret_name }}"
      - name: P1 12x7 integration smoke (invoked only after gate PASS + reader lock verified)
        if: ${{ inputs.confirm_run_approved == 'RUN_APPROVED' }}
        run: |
          echo "GATE PASSED — verify reader_lock_sha256 then run P1 84 cells (per-cell checkpoint/resume)"
          echo "P1 is integration only; NO efficacy conclusion. P1 fail => P2 forbidden."
          # python experiments/r22/main.py --phase p1 --reader-lock <sha> ...
