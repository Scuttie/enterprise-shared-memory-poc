name: solar-integration
# OPTIONAL manual live smoke. Runs ONE fictional-data request only when UPSTAGE_API_KEY is present in an
# approved environment. Never runs on PRs; never blocks ordinary CI; never reruns research benchmarks.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: solar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: One fictional-data smoke (skips if no key)
        env:
          UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY }}
        run: |
          if [ -z "$UPSTAGE_API_KEY" ]; then echo "no UPSTAGE_API_KEY -> skip (non-blocking)"; exit 0; fi
          python scripts/solar_smoke.py
