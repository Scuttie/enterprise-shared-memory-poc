name: TriMem V1 approved benchmark phase

on:
  workflow_dispatch:
  push:
    branches:
      - codex/trimem-coder-v1
    paths:
      - artifacts/trimem_v1/exec_requests/DEVELOPMENT_TUNING_EXEC_REQUEST_013.json

concurrency:
  group: trimem-v1-development-tuning-exec-013
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  branch-trigger-preflight:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/trimem-coder-v1' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.10
          cache: ""
      - name: Install pinned GitHub CLI for branch gate
        run: |
          set -euo pipefail
          expected_bin="$RUNNER_TEMP/trimem-preflight-gh/bin"
          observed_bin="$(
            python scripts/trimem_install_pinned_gh.py \
              --lock configs/trimem_v1/gh_cli_lock.json \
              --prefix "$RUNNER_TEMP/trimem-preflight-gh"
          )"
          test "$observed_bin" = "$expected_bin"
          printf '%s\n' "$observed_bin" >> "$GITHUB_PATH"
      - name: Verify pinned GitHub CLI for branch gate
        run: |
          set -euo pipefail
          resolved_gh="$(command -v gh)"
          test "$resolved_gh" = "$RUNNER_TEMP/trimem-preflight-gh/bin/gh"
          gh --version
          python scripts/trimem_verify_gh_lock.py \
            --lock configs/trimem_v1/gh_cli_lock.json \
            --prefix "$RUNNER_TEMP/trimem-preflight-gh"
      - name: Verify one-time zero-authority DEV trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -I -S scripts/trimem_freeze.py --check --require-git-tracked
          python -I -S scripts/trimem_development_trigger_d113.py \
            --repository "$GITHUB_WORKSPACE" \
            --event-path "$GITHUB_EVENT_PATH"

  bounded-context-preflight:
    needs: branch-trigger-preflight
    if: >-
      always() &&
      !cancelled() &&
      ((github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/codex/trimem-coder-v1' &&
        github.run_attempt == 1 &&
        needs.branch-trigger-preflight.result == 'success'))
    runs-on: [self-hosted, linux, x64, trimem-ubuntu-24.04, trimem-benchmark]
    timeout-minutes: 45
    steps:
      - name: Checkout bounded-context correction
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify complete cached Python before setup-python
        env:
          LD_LIBRARY_PATH: /opt/trimem-runner-cache/work-ci/_tool/Python/3.11.10/x64/lib
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: >-
          /opt/trimem-runner-cache/work-ci/_tool/Python/3.11.10/x64/bin/python
          -I -S scripts/trimem_development_trigger_d113.py
          --repository "$GITHUB_WORKSPACE"
          --pre-setup-cache-host-event-path "$GITHUB_EVENT_PATH"
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        env:
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        with:
          python-version: 3.11.10
          cache: ""
      - name: Re-observe exact self-hosted runner before any install or materialization
        run: >-
          python -I -S scripts/trimem_development_trigger_d113.py
          --repository "$GITHUB_WORKSPACE"
          --runner-host-preflight-event-path "$GITHUB_EVENT_PATH"
      - name: Install hash-locked environment
        run: |
          python -m pip install --require-hashes -r configs/trimem_v1/benchmark_environment.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify bounded context round trip before provider access
        run: python scripts/trimem_context_roundtrip.py
      - name: Verify production terminal-cell round trip before provider access
        run: >-
          python scripts/trimem_pytest_no_skip.py
          tests/unit/test_trimem_d18_terminal_contract_integration.py
          tests/unit/test_trimem_d19_bounded_short_term_context.py::test_mixed_72_cell_aggregate_public_and_terminal_ledger_round_trip
      - name: Materialize pinned harnesses in unprotected loader preflight
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from trimem_harness_lock import prepare_harnesses

          checkout_root = Path(os.environ["RUNNER_TEMP"]) / "trimem-d112-harnesses"
          observed = prepare_harnesses(checkout_root)
          if set(observed) != {
              "swebench_verified",
              "multi_swe_bench_mini",
              "multi_swe_bench_flash",
          }:
              raise SystemExit("pinned harness set differs")
          PY
      - name: Gate protected job on unprotected exact loader preflight
        run: |
          set -euo pipefail
          exact_python="$pythonLocation/bin/python"
          preflight_output="$RUNNER_TEMP/trimem-official-harness-loader-preflight.json"
          test -x "$exact_python"
          test "$(readlink -f "$exact_python")" = "$(readlink -f "$(command -v python)")"
          "$exact_python" scripts/trimem_official_harness_loader_preflight.py \
            --python-binary "$exact_python" \
            --swe-harness-root "$RUNNER_TEMP/trimem-d112-harnesses/swebench_verified" \
            --multi-harness-root "$RUNNER_TEMP/trimem-d112-harnesses/multi" \
            --output "$preflight_output"
          "$exact_python" - "$preflight_output" "$exact_python" <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from trimem_benchmark_run import (
              validate_official_harness_loader_preflight_evidence,
          )

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          validate_official_harness_loader_preflight_evidence(
              report,
              python_binary=sys.argv[2],
          )
          PY

  frozen-serial-phase:
    needs: [branch-trigger-preflight, bounded-context-preflight]
    if: >-
      always() &&
      !cancelled() &&
      ((github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        needs.bounded-context-preflight.result == 'success') ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/codex/trimem-coder-v1' &&
        github.run_attempt == 1 &&
        needs.branch-trigger-preflight.result == 'success' &&
        needs.bounded-context-preflight.result == 'success'))
    runs-on: [self-hosted, linux, x64, trimem-ubuntu-24.04, trimem-benchmark]
    timeout-minutes: 7200
    environment: trimem-benchmark-exec
    env:
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_DISABLE_TELEMETRY: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      TOKENIZERS_PARALLELISM: "false"
      TRIMEM_DATABASE_URL: postgresql+asyncpg://api_service:api_pw@127.0.0.1:5432/trimem_benchmark
      TRIMEM_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - name: Checkout approved frozen source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify complete cached Python before setup-python
        env:
          LD_LIBRARY_PATH: /opt/trimem-runner-cache/work-ci/_tool/Python/3.11.10/x64/lib
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: >-
          /opt/trimem-runner-cache/work-ci/_tool/Python/3.11.10/x64/bin/python
          -I -S scripts/trimem_development_trigger_d113.py
          --repository "$GITHUB_WORKSPACE"
          --pre-setup-cache-host-event-path "$GITHUB_EVENT_PATH"
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        env:
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        with:
          python-version: 3.11.10
          cache: ""
      - name: Re-observe protected runner before cache-only service creation
        run: >-
          python -I -S scripts/trimem_development_trigger_d113.py
          --repository "$GITHUB_WORKSPACE"
          --protected-runner-preflight-event-path "$GITHUB_EVENT_PATH"
      - name: Start exact cache-only benchmark services
        run: >-
          python -I -S scripts/trimem_development_trigger_d113.py
          --repository "$GITHUB_WORKSPACE"
          --start-protected-services-event-path "$GITHUB_EVENT_PATH"
      - name: Verify exact cache-only benchmark services
        run: >-
          python -I -S scripts/trimem_development_trigger_d113.py
          --repository "$GITHUB_WORKSPACE"
          --verify-protected-services-event-path "$GITHUB_EVENT_PATH"
      - name: Install hash-locked environment
        run: |
          python -m pip install --require-hashes -r configs/trimem_v1/benchmark_environment.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Install exact pinned GitHub CLI
        run: |
          set -euo pipefail
          expected_bin="$RUNNER_TEMP/trimem-gh/bin"
          observed_bin="$(
            python scripts/trimem_install_pinned_gh.py \
              --lock configs/trimem_v1/gh_cli_lock.json \
              --prefix "$RUNNER_TEMP/trimem-gh"
          )"
          test "$observed_bin" = "$expected_bin"
          printf '%s\n' "$observed_bin" >> "$GITHUB_PATH"
      - name: Verify exact GitHub CLI
        run: |
          set -euo pipefail
          resolved_gh="$(command -v gh)"
          test "$resolved_gh" = "$RUNNER_TEMP/trimem-gh/bin/gh"
          gh --version
          python scripts/trimem_verify_gh_lock.py \
            --lock configs/trimem_v1/gh_cli_lock.json \
            --prefix "$RUNNER_TEMP/trimem-gh"
      - name: Materialize exact pinned harness sources before credentials
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from trimem_harness_lock import prepare_harnesses

          observed = prepare_harnesses(Path(".trimem-exec/harnesses"))
          if set(observed) != {
              "swebench_verified",
              "multi_swe_bench_mini",
              "multi_swe_bench_flash",
          }:
              raise SystemExit("pinned harness set differs")
          PY
      - name: Verify exact official harness Python loader before credentials
        run: |
          set -euo pipefail
          exact_python="$pythonLocation/bin/python"
          test -x "$exact_python"
          test "$(readlink -f "$exact_python")" = "$(readlink -f "$(command -v python)")"
          install -d -m 700 artifacts/trimem_v1/benchmark_exec/control
          "$exact_python" scripts/trimem_official_harness_loader_preflight.py \
            --python-binary "$exact_python" \
            --swe-harness-root ".trimem-exec/harnesses/swebench_verified" \
            --multi-harness-root ".trimem-exec/harnesses/multi" \
            --output "artifacts/trimem_v1/benchmark_exec/control/official-harness-loader-preflight.json"
      - name: Materialize protected external approval
        id: approval_materialization
        env:
          TRIMEM_EXEC_APPROVAL_B64: ${{ secrets.TRIMEM_EXEC_APPROVAL_B64 }}
        run: |
          set -euo pipefail
          umask 077
          approval_tmp="$RUNNER_TEMP/trimem-exec-approval.json"
          restricted_approval="artifacts/trimem_v1/benchmark_exec/control/restricted-external-approval.json"
          cleanup_partial_approval() {
            status=$?
            if [ "$status" -ne 0 ]; then
              rm -f -- "$approval_tmp" "$restricted_approval"
            fi
            exit "$status"
          }
          trap cleanup_partial_approval EXIT
          python -c "import base64,os,pathlib; pathlib.Path(os.environ['RUNNER_TEMP'],'trimem-exec-approval.json').write_bytes(base64.b64decode(os.environ['TRIMEM_EXEC_APPROVAL_B64'], validate=True))"
          install -d -m 700 artifacts/trimem_v1/benchmark_exec/control
          install -m 600 "$approval_tmp" "$restricted_approval"
          cmp --silent "$approval_tmp" "$restricted_approval"
          trap - EXIT
      - name: Resolve only the approved committed phase
        run: >-
          python scripts/trimem_approved_phase.py
          --approval-file "$RUNNER_TEMP/trimem-exec-approval.json"
          --github-env "$GITHUB_ENV"
      - name: Enforce the event-specific benchmark phase
        run: >-
          python -c "import os; event=os.environ['GITHUB_EVENT_NAME']; split=os.environ['TRIMEM_EXEC_SPLIT']; assert (event == 'push' and split == 'development') or (event == 'workflow_dispatch' and split == 'heldout')"
      - name: Verify exact phase EXEC gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/trimem_verify_ready.py
          --level benchmark-exec
          --require-git-tracked
          --approval-file "$RUNNER_TEMP/trimem-exec-approval.json"
      - name: Validate exact OpenAI credential format before network access
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/trimem_validate_openai_credential.py
      - name: Verify run-bound OpenAI credential commitment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python scripts/trimem_verify_openai_key_binding.py
          --approval-file "$RUNNER_TEMP/trimem-exec-approval.json"
      - name: Retrieve exact model metadata before image materialization
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python scripts/trimem_openai_model_access_check.py
          --approval-file "$RUNNER_TEMP/trimem-exec-approval.json"
          --restricted-evidence-dir "artifacts/trimem_v1/benchmark_exec/$TRIMEM_EXEC_SPLIT/restricted/model-access"
          --output "artifacts/trimem_v1/benchmark_exec/$TRIMEM_EXEC_SPLIT/control/model-access-result.json"
      - name: Verify evidence passphrase before scientific work
        env:
          TRIMEM_EVIDENCE_PASSPHRASE: ${{ secrets.TRIMEM_EVIDENCE_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$TRIMEM_EVIDENCE_PASSPHRASE"
      - name: Execute one native-action protocol canary before benchmark images
        if: env.TRIMEM_EXEC_SPLIT == 'development'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python scripts/trimem_action_canary.py
          --approval-file "$RUNNER_TEMP/trimem-exec-approval.json"
          --output "artifacts/trimem_v1/benchmark_exec/$TRIMEM_EXEC_SPLIT/control/protocol-action-canary.json"
      - name: Apply exact migration head
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/trimem_benchmark
          MIGRATION_PASSWORD: postgres
          MIGRATION_USER: postgres
          PGDATABASE: trimem_benchmark
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres
          PGUSER: postgres
        run: |
          python scripts/postgres_bootstrap.py
          python -m alembic upgrade head
      - name: Pull committed images by digest and verify local observations
        if: ${{ !cancelled() && success() }}
        run: >-
          python scripts/trimem_pull_locked_images.py
          --phase "$TRIMEM_EXEC_SPLIT"
          --approval-file "$RUNNER_TEMP/trimem-exec-approval.json"
          --evidence-dir "artifacts/trimem_v1/benchmark_exec/$TRIMEM_EXEC_SPLIT/image-materialization"
      - name: Execute frozen serial streams with one atomic phase ledger
        if: ${{ !cancelled() && success() }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRIMEM_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/trimem_benchmark
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          python scripts/trimem_run_with_resume.py \
            --split "$TRIMEM_EXEC_SPLIT" \
            --approval-file "$RUNNER_TEMP/trimem-exec-approval.json"
      - name: Aggregate exact stream and target set fail closed
        run: >-
          python scripts/trimem_benchmark_matrix.py aggregate
          --manifest "$TRIMEM_EXEC_SPLIT"
          --results-dir "artifacts/trimem_v1/benchmark_exec/$TRIMEM_EXEC_SPLIT"
          --output "artifacts/trimem_v1/benchmark_exec/$TRIMEM_EXEC_SPLIT/aggregate.json"
      - name: Build public allowlisted result
        run: >-
          python scripts/trimem_public_artifact.py
          --source "artifacts/trimem_v1/benchmark_exec/$TRIMEM_EXEC_SPLIT"
          --aggregate "artifacts/trimem_v1/benchmark_exec/$TRIMEM_EXEC_SPLIT/aggregate.json"
          --output "artifacts/trimem_v1/benchmark_exec/$TRIMEM_EXEC_SPLIT/public-results.json"
      - name: Inventory complete restricted benchmark evidence
        id: benchmark_evidence_inventory
        if: >-
          always() &&
          steps.approval_materialization.outcome == 'success'
        run: |
          set -euo pipefail
          python scripts/trimem_evidence_inventory.py \
            --root artifacts/trimem_v1/benchmark_exec \
            --root-label benchmark_exec \
            --output "$RUNNER_TEMP/trimem-benchmark-exec-inventory.json"
          if [ -d artifacts/trimem_v1/development_selection ]; then
            python scripts/trimem_evidence_inventory.py \
              --root artifacts/trimem_v1/development_selection \
              --root-label development_selection \
              --output "$RUNNER_TEMP/trimem-development-selection-inventory.json"
          fi
      - name: Encrypt complete restricted evidence
        id: encrypt_evidence
        if: >-
          always() &&
          steps.benchmark_evidence_inventory.outcome == 'success'
        env:
          TRIMEM_EVIDENCE_PASSPHRASE: ${{ secrets.TRIMEM_EVIDENCE_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$TRIMEM_EVIDENCE_PASSPHRASE"
          evidence_paths=(benchmark_exec)
          if [ -d artifacts/trimem_v1/development_selection ]; then
            evidence_paths+=(development_selection)
          fi
          tar -C artifacts/trimem_v1 -cf - "${evidence_paths[@]}" \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:TRIMEM_EVIDENCE_PASSPHRASE -out "$RUNNER_TEMP/trimem-benchmark-restricted.tar.enc"
      - name: Upload public benchmark result
        if: ${{ always() && !cancelled() && success() }}
        id: public-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-benchmark-public
          path: |
            artifacts/trimem_v1/benchmark_exec/*/public-results.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload encrypted restricted evidence
        if: always() && !cancelled() && steps.encrypt_evidence.outcome == 'success'
        id: restricted-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-benchmark-restricted-encrypted
          path: ${{ runner.temp }}/trimem-benchmark-restricted.tar.enc
          if-no-files-found: error
          retention-days: 14
      - name: Upload non-sensitive benchmark evidence inventories
        if: always() && !cancelled() && steps.benchmark_evidence_inventory.outcome == 'success'
        id: inventory-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-benchmark-evidence-inventories
          path: ${{ runner.temp }}/trimem-*-inventory.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify durable external artifact custody before cleanup
        id: external-custody-verification
        if: >-
          always() &&
          !cancelled() &&
          steps.restricted-upload.outcome == 'success' &&
          steps.inventory-upload.outcome == 'success' &&
          (steps.public-upload.outcome == 'success' ||
           steps.public-upload.outcome == 'skipped')
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_UPLOAD_OUTCOME: ${{ steps.public-upload.outcome }}
          PUBLIC_ARTIFACT_ID: ${{ steps.public-upload.outputs.artifact-id }}
          PUBLIC_ARTIFACT_DIGEST: ${{ steps.public-upload.outputs.artifact-digest }}
          RESTRICTED_ARTIFACT_ID: ${{ steps.restricted-upload.outputs.artifact-id }}
          RESTRICTED_ARTIFACT_DIGEST: ${{ steps.restricted-upload.outputs.artifact-digest }}
          INVENTORY_ARTIFACT_ID: ${{ steps.inventory-upload.outputs.artifact-id }}
          INVENTORY_ARTIFACT_DIGEST: ${{ steps.inventory-upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python scripts/trimem_verify_remote_custody.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --public-upload-outcome "$PUBLIC_UPLOAD_OUTCOME" \
            --public-artifact-id "$PUBLIC_ARTIFACT_ID" \
            --public-artifact-digest "$PUBLIC_ARTIFACT_DIGEST" \
            --restricted-artifact-id "$RESTRICTED_ARTIFACT_ID" \
            --restricted-artifact-digest "$RESTRICTED_ARTIFACT_DIGEST" \
            --inventory-artifact-id "$INVENTORY_ARTIFACT_ID" \
            --inventory-artifact-digest "$INVENTORY_ARTIFACT_DIGEST" \
            --output "$RUNNER_TEMP/trimem-remote-custody-result.json"
      - name: Upload sanitized remote-custody result before cleanup
        id: custody-result-upload
        if: >-
          always() &&
          !cancelled() &&
          steps.external-custody-verification.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-benchmark-remote-custody
          path: ${{ runner.temp }}/trimem-remote-custody-result.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove plaintext external approval after encryption attempt
        if: >-
          always() &&
          steps.approval_materialization.outcome == 'success' &&
          steps.external-custody-verification.outcome == 'success' &&
          steps.custody-result-upload.outcome == 'success'
        run: |
          set -euo pipefail
          rm -f -- \
            "$RUNNER_TEMP/trimem-exec-approval.json" \
            artifacts/trimem_v1/benchmark_exec/control/restricted-external-approval.json
          test ! -e "$RUNNER_TEMP/trimem-exec-approval.json"
          test ! -e artifacts/trimem_v1/benchmark_exec/control/restricted-external-approval.json
      - name: Remove plaintext and temporary EXEC material
        if: always()
        env:
          RESTRICTED_UPLOAD_OUTCOME: ${{ steps.restricted-upload.outcome }}
          INVENTORY_UPLOAD_OUTCOME: ${{ steps.inventory-upload.outcome }}
          EXTERNAL_CUSTODY_VERIFICATION_OUTCOME: ${{ steps.external-custody-verification.outcome }}
          CUSTODY_RESULT_UPLOAD_OUTCOME: ${{ steps.custody-result-upload.outcome }}
        run: |
          set -euo pipefail
          if [ "$RESTRICTED_UPLOAD_OUTCOME" != "success" ] || \
             [ "$INVENTORY_UPLOAD_OUTCOME" != "success" ] || \
             [ "$EXTERNAL_CUSTODY_VERIFICATION_OUTCOME" != "success" ] || \
             [ "$CUSTODY_RESULT_UPLOAD_OUTCOME" != "success" ]; then
            echo "external artifact custody was not verified; preserving plaintext and ciphertext" >&2
            exit 1
          fi
          python scripts/trimem_cleanup_exec.py --phase benchmark
          test ! -e artifacts/trimem_v1/benchmark_exec
          test ! -e artifacts/trimem_v1/development_selection
          test ! -e "$RUNNER_TEMP/trimem-exec-approval.json"
          test ! -e "$RUNNER_TEMP/trimem-benchmark-restricted.tar.enc"
      - name: Remove exact cache-only benchmark services
        if: always()
        run: >-
