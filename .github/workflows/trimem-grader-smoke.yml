name: TriMem V1 official grader smoke

on:
  workflow_dispatch:
  push:
    branches:
      - codex/trimem-coder-v1
    paths:
      - artifacts/trimem_v1/exec_requests/GRADER_SMOKE_EXEC_REQUEST_005.json

concurrency:
  group: trimem-v1-grader-smoke-exec-005
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  branch-trigger-preflight:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.10
          cache: ""
      - name: Verify one-time zero-cost branch trigger
        run: >-
          python scripts/trimem_grader_smoke_trigger_preflight.py
          --repository "$GITHUB_WORKSPACE"
          --event-path "$GITHUB_EVENT_PATH"

  frozen-gold-noop-smoke:
    needs: branch-trigger-preflight
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main') ||
       needs.branch-trigger-preflight.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: trimem-grader-smoke-exec
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_DISABLE_TELEMETRY: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout approved frozen source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.10
          cache: ""
      - name: Install hash-locked environment
        run: |
          python -m pip install --require-hashes -r configs/trimem_v1/benchmark_environment.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Materialize protected external approval
        id: approval_materialization
        env:
          TRIMEM_EXEC_APPROVAL_B64: ${{ secrets.TRIMEM_EXEC_APPROVAL_B64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p artifacts/trimem_v1/grader_smoke_exec/workflow-stages/exec-gate
          python -c "import base64,os,pathlib; pathlib.Path(os.environ['RUNNER_TEMP'],'trimem-exec-approval.json').write_bytes(base64.b64decode(os.environ['TRIMEM_EXEC_APPROVAL_B64'], validate=True))"
      - name: Verify pre-container smoke EXEC gate
        id: exec_gate
        run: |
          set -euo pipefail
          umask 077
          python scripts/trimem_verify_ready.py \
            --level grader-smoke-exec \
            --require-git-tracked \
            --approval-file "$RUNNER_TEMP/trimem-exec-approval.json" \
            --pre-cell-failure-output artifacts/trimem_v1/grader_smoke_exec/results \
            > artifacts/trimem_v1/grader_smoke_exec/workflow-stages/exec-gate/stdout.txt \
            2> artifacts/trimem_v1/grader_smoke_exec/workflow-stages/exec-gate/stderr.txt
      - name: Run bounded-disk exact GOLD and NOOP_BASELINE pairs serially
        id: run_smoke
        run: |
          set -euo pipefail
          umask 077
          mkdir -p artifacts/trimem_v1/grader_smoke_exec/workflow-stages/run-smoke
          python scripts/trimem_grader_smoke.py \
            --approval-file "$RUNNER_TEMP/trimem-exec-approval.json" \
            --output-dir artifacts/trimem_v1/grader_smoke_exec/results \
            --image-evidence-dir artifacts/trimem_v1/grader_smoke_exec/image-materialization \
            > artifacts/trimem_v1/grader_smoke_exec/workflow-stages/run-smoke/stdout.txt \
            2> artifacts/trimem_v1/grader_smoke_exec/workflow-stages/run-smoke/stderr.txt
      - name: Aggregate exact target set fail closed
        id: aggregate
        run: |
          set -euo pipefail
          umask 077
          mkdir -p artifacts/trimem_v1/grader_smoke_exec/workflow-stages/aggregate
          python scripts/trimem_benchmark_matrix.py aggregate \
            --manifest grader-smoke \
            --results-dir artifacts/trimem_v1/grader_smoke_exec/results \
            --image-evidence-dir artifacts/trimem_v1/grader_smoke_exec/image-materialization \
            --output artifacts/trimem_v1/grader_smoke_exec/aggregate.json \
            > artifacts/trimem_v1/grader_smoke_exec/workflow-stages/aggregate/stdout.txt \
            2> artifacts/trimem_v1/grader_smoke_exec/workflow-stages/aggregate/stderr.txt
      - name: Build public allowlisted result
        id: public_result
        run: |
          set -euo pipefail
          umask 077
          mkdir -p artifacts/trimem_v1/grader_smoke_exec/workflow-stages/public-result
          python scripts/trimem_public_artifact.py \
            --source artifacts/trimem_v1/grader_smoke_exec/results \
            --aggregate artifacts/trimem_v1/grader_smoke_exec/aggregate.json \
            --output artifacts/trimem_v1/grader_smoke_exec/public-results.json \
            > artifacts/trimem_v1/grader_smoke_exec/workflow-stages/public-result/stdout.txt \
            2> artifacts/trimem_v1/grader_smoke_exec/workflow-stages/public-result/stderr.txt
      - name: Remove only frozen smoke image references
        id: workflow_image_cleanup
        if: >-
          always() &&
          steps.exec_gate.outcome == 'success' &&
          steps.run_smoke.outcome != 'skipped'
        run: |
          set -euo pipefail
          umask 077
          mkdir -p artifacts/trimem_v1/grader_smoke_exec/workflow-stages/image-cleanup
          python scripts/trimem_pull_locked_images.py \
            --cleanup-grader-smoke \
            --evidence-dir artifacts/trimem_v1/grader_smoke_exec/workflow-image-cleanup \
            > artifacts/trimem_v1/grader_smoke_exec/workflow-stages/image-cleanup/stdout.txt \
            2> artifacts/trimem_v1/grader_smoke_exec/workflow-stages/image-cleanup/stderr.txt
      - name: Recover or revoke terminal authority after any campaign failure
        id: campaign_authority_rollback
        if: >-
          always() &&
          steps.exec_gate.outcome == 'success' &&
          steps.run_smoke.outcome != 'skipped' &&
          (steps.run_smoke.outcome != 'success' ||
           steps.aggregate.outcome != 'success' ||
           steps.public_result.outcome != 'success' ||
           steps.workflow_image_cleanup.outcome != 'success')
        env:
          RUN_SMOKE_OUTCOME: ${{ steps.run_smoke.outcome }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
          PUBLIC_RESULT_OUTCOME: ${{ steps.public_result.outcome }}
          IMAGE_CLEANUP_OUTCOME: ${{ steps.workflow_image_cleanup.outcome }}
        run: |
          set -euo pipefail
          umask 077
          if [ "$RUN_SMOKE_OUTCOME" != "success" ]; then
            cause_stage="authority_finalization"
            failure_taxonomy="infrastructure_failures"
            reason="grader-smoke campaign authority finalization did not succeed"
          elif [ "$AGGREGATE_OUTCOME" != "success" ]; then
            cause_stage="external_aggregate"
            failure_taxonomy="aggregate_failures"
            reason="external aggregate stage did not succeed"
          elif [ "$PUBLIC_RESULT_OUTCOME" != "success" ]; then
            cause_stage="public_artifact"
            failure_taxonomy="aggregate_failures"
            reason="public artifact stage did not succeed"
          else
            cause_stage="image_cleanup"
            failure_taxonomy="image_lifecycle_failures"
            reason="workflow image cleanup stage did not succeed"
          fi
          mkdir -p artifacts/trimem_v1/grader_smoke_exec/workflow-stages/authority-rollback
          export ROLLBACK_REASON="$reason"
          python -c "import os,pathlib; pathlib.Path(os.environ['RUNNER_TEMP'],'trimem-authority-rollback-reason.txt').write_bytes(os.environ['ROLLBACK_REASON'].encode('utf-8'))"
          python scripts/trimem_grader_smoke_authority.py \
            --output-root artifacts/trimem_v1/grader_smoke_exec/results \
            --cause-stage "$cause_stage" \
            --failure-taxonomy "$failure_taxonomy" \
            --reason-file "$RUNNER_TEMP/trimem-authority-rollback-reason.txt" \
            --recover-interrupted \
            > artifacts/trimem_v1/grader_smoke_exec/workflow-stages/authority-rollback/stdout.txt \
            2> artifacts/trimem_v1/grader_smoke_exec/workflow-stages/authority-rollback/stderr.txt
          rm -f -- "$RUNNER_TEMP/trimem-authority-rollback-reason.txt"
      - name: Inventory every restricted evidence file
        id: evidence_inventory
        if: >-
          always() &&
          steps.approval_materialization.outcome != 'skipped'
        run: |
          set -euo pipefail
          umask 077
          python scripts/trimem_evidence_inventory.py \
            --root artifacts/trimem_v1/grader_smoke_exec \
            --root-label grader_smoke_exec \
            --output "$RUNNER_TEMP/trimem-grader-smoke-evidence-inventory.json"
      - name: Build namespaced exec-005 campaign failure closure
        id: failure_closure
        if: >-
          always() &&
          steps.evidence_inventory.outcome == 'success' &&
          (steps.campaign_authority_rollback.outcome == 'success' ||
           steps.campaign_authority_rollback.outcome == 'skipped') &&
          (steps.exec_gate.outcome != 'success' ||
           steps.run_smoke.outcome != 'success' ||
           steps.aggregate.outcome != 'success' ||
           steps.public_result.outcome != 'success' ||
           steps.workflow_image_cleanup.outcome != 'success')
        run: |
          set -euo pipefail
          umask 077
          python scripts/trimem_grader_smoke_failure_closure.py \
            --restricted-root artifacts/trimem_v1/grader_smoke_exec \
            --evidence-inventory "$RUNNER_TEMP/trimem-grader-smoke-evidence-inventory.json" \
            --request artifacts/trimem_v1/exec_requests/GRADER_SMOKE_EXEC_REQUEST_005.json \
            --approval-file "$RUNNER_TEMP/trimem-exec-approval.json" \
            --workflow-conclusion "${{ job.status }}" \
            --output "$RUNNER_TEMP/trimem-grader-smoke-exec-005-failure-receipt.json"
      - name: Encrypt complete restricted evidence
        id: encrypt_evidence
        if: >-
          always() &&
          steps.approval_materialization.outcome != 'skipped'
        env:
          TRIMEM_EVIDENCE_PASSPHRASE: ${{ secrets.TRIMEM_EVIDENCE_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          inventory_args=()
          if [ -f "$RUNNER_TEMP/trimem-grader-smoke-evidence-inventory.json" ]; then
            inventory_args=(
              -C "$RUNNER_TEMP"
              trimem-grader-smoke-evidence-inventory.json
            )
          fi
          tar -cf - \
            -C artifacts/trimem_v1/grader_smoke_exec . \
            "${inventory_args[@]}" \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:TRIMEM_EVIDENCE_PASSPHRASE -out "$RUNNER_TEMP/trimem-grader-smoke-restricted.tar.enc"
      - name: Build deterministic official smoke attestation subject
        id: attestation_subject
        run: |
          set -euo pipefail
          umask 077
          python scripts/trimem_smoke_attestation.py \
            --public-result artifacts/trimem_v1/grader_smoke_exec/public-results.json \
            --evidence-inventory "$RUNNER_TEMP/trimem-grader-smoke-evidence-inventory.json" \
            --encrypted-evidence "$RUNNER_TEMP/trimem-grader-smoke-restricted.tar.enc" \
            --approval-file "$RUNNER_TEMP/trimem-exec-approval.json" \
            --output "$RUNNER_TEMP/attestation-subject.json"
          python -c "import os,pathlib,shutil; source=pathlib.Path('artifacts/trimem_v1/grader_smoke_exec/public-results.json'); target=pathlib.Path(os.environ['RUNNER_TEMP'],'trimem-grader-smoke-public-results.json'); assert source.is_file() and not target.exists(); shutil.copyfile(source,target); assert source.read_bytes() == target.read_bytes()"
      - name: Upload namespaced exec-005 failure closure
        id: upload_failure_closure
        if: always() && steps.failure_closure.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-grader-smoke-exec-005-failure-closure
          path: |
            ${{ runner.temp }}/trimem-grader-smoke-exec-005-failure-receipt.json
            ${{ runner.temp }}/trimem-grader-smoke-evidence-inventory.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload non-sensitive restricted evidence inventory
        id: upload_inventory
        if: always() && steps.evidence_inventory.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-grader-smoke-exec-005-evidence-inventory
          path: ${{ runner.temp }}/trimem-grader-smoke-evidence-inventory.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload encrypted restricted evidence
        if: always() && steps.encrypt_evidence.outcome == 'success'
        id: restricted_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-grader-smoke-exec-005-restricted-encrypted
          path: ${{ runner.temp }}/trimem-grader-smoke-restricted.tar.enc
          if-no-files-found: error
          retention-days: 14
      - name: Remove plaintext and temporary EXEC material before signing
        if: always()
        env:
          RESTRICTED_UPLOAD_OUTCOME: ${{ steps.restricted_upload.outcome }}
        run: |
          set -euo pipefail
          if [ "$RESTRICTED_UPLOAD_OUTCOME" != "success" ]; then
            echo "encrypted restricted evidence was not durably uploaded; preserving plaintext and ciphertext" >&2
            exit 1
          fi
          set +e
          python scripts/trimem_cleanup_exec.py --phase grader-smoke
          cleanup_status=$?
          rm -f -- "$RUNNER_TEMP/trimem-grader-smoke-exec-005-failure-receipt.json"
          failure_receipt_status=$?
          rm -f -- "$RUNNER_TEMP/trimem-grader-smoke-evidence-inventory.json"
          inventory_status=$?
          rm -f -- "$RUNNER_TEMP/trimem-authority-rollback-reason.txt"
          rollback_reason_status=$?
          if [ "$cleanup_status" -ne 0 ]; then
            exit "$cleanup_status"
          fi
          if [ "$inventory_status" -ne 0 ]; then
            exit "$inventory_status"
          fi
          if [ "$failure_receipt_status" -ne 0 ]; then
            exit "$failure_receipt_status"
          fi
          if [ "$rollback_reason_status" -ne 0 ]; then
            exit "$rollback_reason_status"
          fi
          set -e
          test ! -e artifacts/trimem_v1/grader_smoke_exec
          test ! -e "$RUNNER_TEMP/trimem-exec-approval.json"
          test ! -e "$RUNNER_TEMP/trimem-grader-smoke-restricted.tar.enc"
          test ! -e "$RUNNER_TEMP/trimem-grader-smoke-exec-005-failure-receipt.json"
          test ! -e "$RUNNER_TEMP/trimem-grader-smoke-evidence-inventory.json"
          test ! -e "$RUNNER_TEMP/trimem-authority-rollback-reason.txt"
      - name: Attest exact uploaded and cleaned official smoke subject
        id: smoke-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          create-storage-record: false
          push-to-registry: false
          subject-path: ${{ runner.temp }}/attestation-subject.json
      - name: Materialize fixed attestation bundle name
        env:
          TRIMEM_ATTESTATION_BUNDLE: ${{ steps.smoke-attestation.outputs.bundle-path }}
        run: >-
          python -c "import os,pathlib,shutil; source=pathlib.Path(os.environ['TRIMEM_ATTESTATION_BUNDLE']); target=pathlib.Path(os.environ['RUNNER_TEMP'],'trimem-grader-smoke-attestation-bundle.json'); assert source.is_file() and not target.exists(); shutil.copyfile(source,target); assert source.read_bytes() == target.read_bytes()"
      - name: Upload public smoke result
        id: upload_public
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-grader-smoke-exec-005-public
          path: |
            ${{ runner.temp }}/trimem-grader-smoke-public-results.json
            ${{ runner.temp }}/attestation-subject.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload official smoke attestation bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-grader-smoke-exec-005-attestation-bundle
          path: ${{ runner.temp }}/trimem-grader-smoke-attestation-bundle.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove staged attestation material
        if: always()
        env:
          TRIMEM_ATTESTATION_BUNDLE: ${{ steps.smoke-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/attestation-subject.json"
          rm -f -- "$RUNNER_TEMP/trimem-grader-smoke-public-results.json"
          rm -f -- "$RUNNER_TEMP/trimem-grader-smoke-attestation-bundle.json"
          if [ -n "${TRIMEM_ATTESTATION_BUNDLE:-}" ]; then
            rm -f -- "$TRIMEM_ATTESTATION_BUNDLE"
          fi
          test ! -e "$RUNNER_TEMP/attestation-subject.json"
          test ! -e "$RUNNER_TEMP/trimem-grader-smoke-public-results.json"
          test ! -e "$RUNNER_TEMP/trimem-grader-smoke-attestation-bundle.json"
