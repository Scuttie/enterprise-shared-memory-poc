name: TriMem V1 official grader smoke

on:
  workflow_dispatch:
  push:
    branches:
      - codex/trimem-coder-v1
    paths:
      - artifacts/trimem_v1/exec_requests/GRADER_SMOKE_EXEC_REQUEST.json

permissions:
  contents: read

jobs:
  branch-trigger-preflight:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.10
          cache: ""
      - name: Verify one-time zero-cost branch trigger
        run: >-
          python scripts/trimem_grader_smoke_trigger_preflight.py
          --repository "$GITHUB_WORKSPACE"
          --event-path "$GITHUB_EVENT_PATH"

  frozen-gold-noop-smoke:
    needs: branch-trigger-preflight
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main') ||
       needs.branch-trigger-preflight.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: trimem-grader-smoke-exec
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_DISABLE_TELEMETRY: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout approved frozen source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.10
          cache: ""
      - name: Install hash-locked environment
        run: |
          python -m pip install --require-hashes -r configs/trimem_v1/benchmark_environment.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Materialize protected external approval
        env:
          TRIMEM_EXEC_APPROVAL_B64: ${{ secrets.TRIMEM_EXEC_APPROVAL_B64 }}
        run: |
          python -c "import base64,os,pathlib; pathlib.Path(os.environ['RUNNER_TEMP'],'trimem-exec-approval.json').write_bytes(base64.b64decode(os.environ['TRIMEM_EXEC_APPROVAL_B64'], validate=True))"
          mkdir -p artifacts/trimem_v1/grader_smoke_exec
      - name: Verify pre-container smoke EXEC gate
        run: >-
          python scripts/trimem_verify_ready.py
          --level grader-smoke-exec
          --require-git-tracked
          --approval-file "$RUNNER_TEMP/trimem-exec-approval.json"
      - name: Run bounded-disk exact GOLD and NOOP_BASELINE pairs serially
        run: >-
          python scripts/trimem_grader_smoke.py
          --approval-file "$RUNNER_TEMP/trimem-exec-approval.json"
          --output-dir artifacts/trimem_v1/grader_smoke_exec/results
          --image-evidence-dir artifacts/trimem_v1/grader_smoke_exec/image-materialization
      - name: Aggregate exact target set fail closed
        run: >-
          python scripts/trimem_benchmark_matrix.py aggregate
          --manifest grader-smoke
          --results-dir artifacts/trimem_v1/grader_smoke_exec/results
          --image-evidence-dir artifacts/trimem_v1/grader_smoke_exec/image-materialization
          --output artifacts/trimem_v1/grader_smoke_exec/aggregate.json
      - name: Build public allowlisted result
        run: >-
          python scripts/trimem_public_artifact.py
          --source artifacts/trimem_v1/grader_smoke_exec/results
          --aggregate artifacts/trimem_v1/grader_smoke_exec/aggregate.json
          --output artifacts/trimem_v1/grader_smoke_exec/public-results.json
      - name: Remove only frozen smoke image references
        if: always()
        run: >-
          python scripts/trimem_pull_locked_images.py
          --cleanup-grader-smoke
          --evidence-dir artifacts/trimem_v1/grader_smoke_exec/workflow-image-cleanup
      - name: Inventory every restricted evidence file
        if: always()
        run: >-
          python scripts/trimem_evidence_inventory.py
          --root artifacts/trimem_v1/grader_smoke_exec
          --root-label grader_smoke_exec
          --output "$RUNNER_TEMP/trimem-grader-smoke-evidence-inventory.json"
      - name: Encrypt complete restricted evidence
        if: always()
        env:
          TRIMEM_EVIDENCE_PASSPHRASE: ${{ secrets.TRIMEM_EVIDENCE_PASSPHRASE }}
        run: |
          set -euo pipefail
          tar -cf - \
            -C artifacts/trimem_v1/grader_smoke_exec . \
            -C "$RUNNER_TEMP" trimem-grader-smoke-evidence-inventory.json \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:TRIMEM_EVIDENCE_PASSPHRASE -out "$RUNNER_TEMP/trimem-grader-smoke-restricted.tar.enc"
      - name: Build deterministic official smoke attestation subject
        run: |
          set -euo pipefail
          python scripts/trimem_smoke_attestation.py \
            --public-result artifacts/trimem_v1/grader_smoke_exec/public-results.json \
            --evidence-inventory "$RUNNER_TEMP/trimem-grader-smoke-evidence-inventory.json" \
            --encrypted-evidence "$RUNNER_TEMP/trimem-grader-smoke-restricted.tar.enc" \
            --approval-file "$RUNNER_TEMP/trimem-exec-approval.json" \
            --output artifacts/trimem_v1/grader_smoke_exec/attestation-subject.json
          python -c "import os,pathlib,shutil; source=pathlib.Path('artifacts/trimem_v1/grader_smoke_exec/attestation-subject.json'); target=pathlib.Path(os.environ['RUNNER_TEMP'],'attestation-subject.json'); assert source.is_file() and not target.exists(); shutil.copyfile(source,target); assert source.read_bytes() == target.read_bytes()"
      - name: Upload public smoke result
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-grader-smoke-public
          path: |
            artifacts/trimem_v1/grader_smoke_exec/public-results.json
            artifacts/trimem_v1/grader_smoke_exec/attestation-subject.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload non-sensitive restricted evidence inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-grader-smoke-evidence-inventory
          path: ${{ runner.temp }}/trimem-grader-smoke-evidence-inventory.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload encrypted restricted evidence
        if: always()
        id: restricted-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-grader-smoke-restricted-encrypted
          path: ${{ runner.temp }}/trimem-grader-smoke-restricted.tar.enc
          if-no-files-found: error
          retention-days: 14
      - name: Remove plaintext and temporary EXEC material before signing
        if: always()
        run: |
          set +e
          python scripts/trimem_cleanup_exec.py --phase grader-smoke
          cleanup_status=$?
          rm -f -- "$RUNNER_TEMP/trimem-grader-smoke-evidence-inventory.json"
          inventory_status=$?
          if [ "$cleanup_status" -ne 0 ]; then
            exit "$cleanup_status"
          fi
          if [ "$inventory_status" -ne 0 ]; then
            exit "$inventory_status"
          fi
          test ! -e artifacts/trimem_v1/grader_smoke_exec
          test ! -e "$RUNNER_TEMP/trimem-exec-approval.json"
          test ! -e "$RUNNER_TEMP/trimem-grader-smoke-restricted.tar.enc"
          test ! -e "$RUNNER_TEMP/trimem-grader-smoke-evidence-inventory.json"
      - name: Attest exact uploaded and cleaned official smoke subject
        id: smoke-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          create-storage-record: false
          push-to-registry: false
          subject-path: ${{ runner.temp }}/attestation-subject.json
      - name: Materialize fixed attestation bundle name
        env:
          TRIMEM_ATTESTATION_BUNDLE: ${{ steps.smoke-attestation.outputs.bundle-path }}
        run: >-
          python -c "import os,pathlib,shutil; source=pathlib.Path(os.environ['TRIMEM_ATTESTATION_BUNDLE']); target=pathlib.Path(os.environ['RUNNER_TEMP'],'trimem-grader-smoke-attestation-bundle.json'); assert source.is_file() and not target.exists(); shutil.copyfile(source,target); assert source.read_bytes() == target.read_bytes()"
      - name: Upload official smoke attestation bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trimem-grader-smoke-attestation-bundle
          path: ${{ runner.temp }}/trimem-grader-smoke-attestation-bundle.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove staged attestation material
        if: always()
        env:
          TRIMEM_ATTESTATION_BUNDLE: ${{ steps.smoke-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/attestation-subject.json"
          rm -f -- "$RUNNER_TEMP/trimem-grader-smoke-attestation-bundle.json"
          if [ -n "${TRIMEM_ATTESTATION_BUNDLE:-}" ]; then
            rm -f -- "$TRIMEM_ATTESTATION_BUNDLE"
          fi
          test ! -e "$RUNNER_TEMP/attestation-subject.json"
          test ! -e "$RUNNER_TEMP/trimem-grader-smoke-attestation-bundle.json"
