[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-shared-memory-poc"
version = "0.2.0.dev1"
description = "Governed private/shared memory PoC for coding agents: Mem0 retrieval, canonical contracts, validity gates, and compact literal execution views."
requires-python = ">=3.10,<4.0"
readme = "README.md"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2", "pytest-timeout>=2.3", "alembic>=1.13,<1.14"]
mem0 = ["mem0ai==2.0.17", "sentence-transformers>=3.0", "qdrant-client>=1.9"]
qdrant = ["qdrant-client>=1.9,<2.0"]
postgres = ["SQLAlchemy[asyncio]>=2.0.30,<2.1", "asyncpg>=0.29,<0.31", "alembic>=1.13,<1.14", "psycopg2-binary>=2.9,<3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: requires a PostgreSQL service (ci-postgres)",
           "qdrant: requires PostgreSQL + a vector index (ci-qdrant)"]
